[project]
name = "social-media-as-predictive-information-for-stock-market"
version = "0.1.0"
description = "Financial social media like StockTwits holds rich discussion on public companies, with users sharing opinions, news reactions, and optional Bullish/Bearish labels. This text enables two key research questions: Can NLP models accurately infer an investor's market stance from their post? And does this sentiment predict future stock performance?"
readme = "README.md"


authors = [
    { name = "Matthieu Baucher, Aristide Mawuena, Luca Hachani", email = "ttbaucher@gmail.com, luca.hachani@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "transformers==4.44.2",
    "torch==2.14.1",
    "yfinance>=1.7.0",
    "onnxruntime-gpu>=1.31.0",
    "sentence-transformers>=5.7.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "missingno>=0.5.2",
    "jax==0.4.30",
    "ml-dtypes>=0.6.0",
    "opt-einsum>=3.4.0",
    "optax>=0.1.7",
    "flax>=0.10.4",
    "scikit-learn>=1.9.1",
    "jupyter>=1.1.1",
]

[project.scripts]
social-media-as-predictive-information-for-stock-market = "social_media_as_predictive_information_for_stock_market:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
